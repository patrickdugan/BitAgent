import java.net.URI

plugins {
    id 'com.android.application'
}

def quoteBuildConfig = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def defaultTlWebDist = rootProject.file('../../../TL-Web-main/packages/web-ui/dist').canonicalFile
def configuredTlWebDist = providers.gradleProperty('tlWebDistDir')
    .orElse(providers.environmentVariable('TL_WEB_DIST_DIR'))
    .orNull
def tlWebDist = configuredTlWebDist ? file(configuredTlWebDist).canonicalFile : defaultTlWebDist
def generatedAssets = layout.buildDirectory.dir('generated/tlWebAssets').get().asFile
def configuredAgentUrl = providers.gradleProperty('bitagentUrl')
    .orElse(providers.environmentVariable('BITAGENT_ANDROID_URL'))
    .orNull
    ?.trim() ?: ''

tasks.register('syncTlWebAssets', Exec) {
    group = 'tradelayer mobile'
    description = 'Verify and package the selected TL Web production distribution.'
    inputs.dir(tlWebDist)
    inputs.file(rootProject.file('scripts/package-tlweb.mjs'))
    outputs.dir(generatedAssets)
    commandLine(
        'node',
        rootProject.file('scripts/package-tlweb.mjs').absolutePath,
        '--source', tlWebDist.absolutePath,
        '--destination', generatedAssets.absolutePath
    )
}

android {
    namespace = 'org.tradelayer.mobile'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.tradelayer.mobile'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            buildConfigField(
                'String',
                'BITAGENT_URL',
                quoteBuildConfig(configuredAgentUrl ?: 'http://10.0.2.2:8787')
            )
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            buildConfigField 'String', 'BITAGENT_URL', quoteBuildConfig(configuredAgentUrl)
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main.assets.srcDir(generatedAssets)

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        warningsAsErrors = true
        // AGP 9.2's official default is Gradle 9.4.1; both are checksum-locked for this slice.
        disable 'GradleDependency', 'AndroidGradlePluginVersion'
    }
}

tasks.register('validateReleaseAgentUrl') {
    group = 'verification'
    doLast {
        if (!configuredAgentUrl) {
            throw new GradleException('Release builds require -PbitagentUrl=https://<approved BitAgent host>.')
        }
        URI uri = new URI(configuredAgentUrl)
        boolean remoteHttps = uri.scheme == 'https' && uri.host
        boolean deviceLoopback = uri.scheme == 'http' && uri.host in ['127.0.0.1', 'localhost']
        boolean originOnly = (remoteHttps || deviceLoopback) && !uri.userInfo && !uri.fragment &&
            !uri.query && (!uri.path || uri.path == '/')
        if (!originOnly) {
            throw new GradleException(
                'Release BitAgent URL must be an HTTPS origin or HTTP device loopback without credentials, a path, query, or fragment.'
            )
        }
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('syncTlWebAssets') }
tasks.configureEach { task ->
    if (task.name != 'validateReleaseAgentUrl' && task.name.endsWith('Release')) {
        task.dependsOn tasks.named('validateReleaseAgentUrl')
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.16.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
