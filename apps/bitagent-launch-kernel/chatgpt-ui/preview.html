<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BitAgent ChatGPT plugin preview</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; background: #f3f2ee; color: #161713; }
  body.dark { background: #0b0c0a; color: #f4f1e8; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .layout { display: grid; grid-template-columns: minmax(280px, 380px) minmax(320px, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  select, textarea, button { font: inherit; width: 100%; border-radius: 8px; border: 1px solid rgba(128, 128, 128, 0.5); background: transparent; color: inherit; padding: 8px 10px; }
  select option { color: #161713; }
  textarea { min-height: 220px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; margin-top: 8px; }
  button { cursor: pointer; margin-top: 8px; width: auto; }
  iframe { width: 100%; min-height: 120px; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 14px; background: #fff; }
  body.dark iframe { background: #1b1c19; }
  pre { margin: 12px 0 0; padding: 10px; border-radius: 8px; background: rgba(128, 128, 128, 0.14); max-height: 280px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .muted { opacity: 0.7; }
</style>
</head>
<body>
<h1>BitAgent ChatGPT plugin preview</h1>
<div class="muted">Local harness only. It calls this server's <code>/mcp</code> endpoint and feeds each result to the widget the way a ChatGPT host would.</div>
<div class="layout">
  <section>
    <label for="tool">Tool</label>
    <select id="tool"></select>
    <label for="args" class="muted">Arguments (JSON)</label>
    <textarea id="args" spellcheck="false">{}</textarea>
    <button id="call" type="button">Call tool</button>
    <button id="theme" type="button">Toggle theme</button>
    <pre id="raw"></pre>
  </section>
  <section>
    <iframe id="widget" title="BitAgent widget" sandbox="allow-scripts"></iframe>
  </section>
</div>
<script>
const frame = document.getElementById("widget");
const tool = document.getElementById("tool");
const args = document.getElementById("args");
const raw = document.getElementById("raw");
let theme = "light";
let rpcId = 1;
// A host sends results only after the widget reports it has initialized.
let ready = false;
let lastResult = null;

const SAMPLES = {
  bitagent_self_host_plan: { platform: "windows" },
  bitagent_money_plan: { fundsBorrowedOrNeededSoon: false, emergencyFundMonths: 6, highInterestDebt: false, budgetSats: "250000", userDeclaredBtcPriceUsd: "65000" },
  bitagent_practice_start: { practiceDepositSats: "250000" },
  bitagent_practice_simulate: { workflowId: "", action: "starter_strategy", amountSats: "100000" },
  bitagent_practice_status: { workflowId: "" },
  bitagent_research_stress_test: {
    covenantDraft: {
      mandateId: "btc-range-maker-v1",
      capitalCapUsd: "1000.00",
      strategies: [{ strategyId: "passive_maker", weightBps: 7000 }, { strategyId: "delta_hedge", weightBps: 3000 }],
      absoluteMaxDriftBps: 50,
      risk: { maxGrossLeverageBps: 10000, maxNetDeltaBps: 1000, maxOrderFractionNavBps: 200, maxDailyLossBps: 150, maxDrawdownBps: 500, maxSlippageBps: 12, maxNetworkFeeSats: "5000" }
    },
    scenarios: [
      { label: "calm", market: { bidPriceUsd: "64990.00", askPriceUsd: "65010.00", markPriceUsd: "65000.00" }, portfolio: { capitalUsd: "1000.00", currentNetDeltaBps: -200, grossLeverageBps: 8000, dailyLossBps: 0, drawdownBps: 0 }, targets: [{ strategyId: "passive_maker", targetNetDeltaBps: 1000, policyHint: "QUOTE_BOTH_SIDES" }, { strategyId: "delta_hedge", targetNetDeltaBps: -800, policyHint: "REDUCE_DELTA" }] },
      { label: "loss-limit-hit", market: { bidPriceUsd: "58490.00", askPriceUsd: "58510.00", markPriceUsd: "58500.00" }, portfolio: { capitalUsd: "940.00", currentNetDeltaBps: 900, grossLeverageBps: 9000, dailyLossBps: 200, drawdownBps: 600 }, targets: [{ strategyId: "passive_maker", targetNetDeltaBps: 1000, policyHint: "QUOTE_BOTH_SIDES" }, { strategyId: "delta_hedge", targetNetDeltaBps: 0, policyHint: "HOLD" }] }
    ]
  }
};

async function rpc(method, params) {
  const response = await fetch("/mcp", {
    method: "POST",
    headers: { "content-type": "application/json", accept: "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: rpcId++, method, params })
  });
  return (await response.json()).result;
}

const toWidget = (message) => frame.contentWindow.postMessage({ jsonrpc: "2.0", ...message }, "*");

// Minimal MCP Apps host: answer the widget's handshake and size reports.
window.addEventListener("message", (event) => {
  if (event.source !== frame.contentWindow) return;
  const message = event.data;
  if (!message || message.jsonrpc !== "2.0") return;
  if (message.method === "ui/initialize") {
    toWidget({ id: message.id, result: { protocolVersion: message.params.protocolVersion, hostInfo: { name: "bitagent-preview", version: "0" }, hostCapabilities: {}, hostContext: { theme } } });
  }
  if (message.method === "ui/notifications/initialized") {
    ready = true;
    if (lastResult) toWidget({ method: "ui/notifications/tool-result", params: lastResult });
  }
  if (message.method === "ui/notifications/size-changed") frame.style.height = `${message.params.height + 2}px`;
});

function selectSample() {
  args.value = JSON.stringify(SAMPLES[tool.value] || {}, null, 2);
}

document.getElementById("call").addEventListener("click", async () => {
  try {
    const result = await rpc("tools/call", { name: tool.value, arguments: JSON.parse(args.value || "{}") });
    raw.textContent = JSON.stringify(result.structuredContent, null, 2);
    lastResult = result;
    if (ready) toWidget({ method: "ui/notifications/tool-result", params: result });
    const workflowId = result.structuredContent?.workflowId;
    if (workflowId) {
      SAMPLES.bitagent_practice_simulate.workflowId = workflowId;
      SAMPLES.bitagent_practice_status.workflowId = workflowId;
    }
  } catch (error) {
    raw.textContent = String(error);
  }
});

document.getElementById("theme").addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  document.body.classList.toggle("dark", theme === "dark");
  toWidget({ method: "ui/notifications/host-context-changed", params: { theme } });
});

tool.addEventListener("change", selectSample);
rpc("tools/list", {}).then(async ({ tools }) => {
  for (const item of tools) tool.append(new Option(item.title, item.name));
  selectSample();
  // Load the widget the way a host does: from the MCP resource, not a URL.
  const uri = tools.find((item) => item._meta?.ui)?._meta.ui.resourceUri;
  frame.srcdoc = (await rpc("resources/read", { uri })).contents[0].text;
});
</script>
</body>
</html>
