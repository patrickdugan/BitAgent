[package]
name = "yarn-mcp-gdk"
version = "0.1.0"
edition = "2021"
description = "YaRN-MCP, a Goose GDK app: a goose-agent state machine over a personal chat archive (themes, research threads, interconnections) that distills token-limited packets for YaRN-extended models"
publish = false

[lib]
name = "yarn_mcp_gdk"
path = "src/lib.rs"

[[bin]]
name = "yarn-mcp"
path = "src/main.rs"

[dependencies]
# Goose GDK, pinned to the release the goblin GDK apps, BitAgent desktop/ and DataGoblin gdk/ use.
goose-agent = "=0.1.0-alpha.14"
goose-providers = "=0.1.0-alpha.14"
goose-provider-types = "=0.1.0-alpha.14"
goose-sdk-types = { version = "=0.1.0-alpha.14", default-features = false }
rmcp = { version = "3.11", default-features = false }
anyhow = "1"
async-trait = "0.1"
# goose-provider-types calls chrono::Utc::now() without enabling chrono's clock feature itself.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
